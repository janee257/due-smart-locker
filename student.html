<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUE Smart Locker - Cổng Dịch Vụ Sinh Viên</title>
    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .tab-btn.active {
            border-bottom: 3px solid #ea580c;
            color: #ea580c;
            font-weight: 700;
            background-color: #fff7ed;
        }
        .filter-chip.active {
            background-color: #ea580c;
            color: #ffffff;
            border-color: #ea580c;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-28 font-sans">

    <!-- ================= KHUNG ĐĂNG NHẬP ================= -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-orange-950 to-slate-900">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-200">
            <div class="text-center space-y-1">
                <img src="/logo_due.png" alt="DUE Logo" class="h-16 w-auto mx-auto object-contain bg-white p-1 rounded-2xl shadow-md" onerror="this.onerror=null; this.src='https://due.udn.vn/Portals/0/logo-due.png';">
                <h2 class="font-bold text-lg text-slate-800 pt-2">Cổng Dịch Vụ Sinh Viên</h2>
                <p class="text-[11px] text-slate-500">Hệ thống mượn - trả sách Smart Locker</p>
            </div>

            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Mã số sinh viên (MSSV):</label>
                    <input type="text" id="loginMssv" value="251121514110" required placeholder="Nhập MSSV" 
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-sm outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Mật khẩu:</label>
                    <input type="password" id="loginPassword" value="123456" required placeholder="Nhập mật khẩu" 
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div id="loginError" class="hidden p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 font-semibold text-xs"></div>
                <button type="submit" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-xl text-xs shadow-lg transition">
                    Đăng Nhập Tài Khoản
                </button>
            </form>
        </div>
    </div>

    <!-- ================= GIAO DIỆN CHÍNH ================= -->
    <div id="mainApp" class="hidden">
        <header class="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="/logo_due.png" alt="DUE Logo" class="h-10 w-auto bg-white p-1 rounded-xl shadow-sm object-contain" onerror="this.onerror=null; this.src='https://due.udn.vn/Portals/0/logo-due.png';">
                    <div>
                        <h1 class="font-bold text-base leading-tight">Thư viện DUE</h1>
                        <p class="text-[11px] text-orange-100">Smart Locker Tự Phục Vụ</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="handleLogout()" class="text-xs bg-black/20 hover:bg-black/30 px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div class="space-y-0.5">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Sinh viên DUE</p>
                    <p class="font-bold text-slate-800 text-sm sm:text-base" id="userDisplayName">--</p>
                    <p class="text-xs text-slate-500 font-mono" id="userDisplayMssv">--</p>
                </div>
                <div class="text-right">
                    <span class="bg-emerald-100 text-emerald-700 text-[11px] sm:text-xs px-3 py-1 rounded-full font-bold">Thẻ Hợp Lệ</span>
                </div>
            </div>

            <!-- TAB 1: MƯỢN SÁCH -->
            <div class="space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="search" id="searchInput" oninput="renderBooks()" placeholder="Tìm giáo trình, mã sách, tác giả..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                </div>

                <div class="flex justify-between items-center px-1 text-xs text-slate-500">
                    <span>Kết quả tìm thấy: <b id="resultsCount" class="text-slate-800 font-bold">0</b> đầu sách</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="booksList"></div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1qtSFNNFmVWAo0r0lqIU5cEfCGOKX59M",
            authDomain: "due-smart-locker.firebaseapp.com",
            projectId: "due-smart-locker",
            storageBucket: "due-smart-locker.firebasestorage.app",
            messagingSenderId: "639064006349",
            appId: "1:639064006349:web:ea10677c76872b13989384",
            measurementId: "G-078Z3QDM27"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allBooks = [];

        async function handleLogin(e) {
            e.preventDefault();
            const mssv = document.getElementById('loginMssv').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const errBox = document.getElementById('loginError');
            errBox.classList.add('hidden');

            try {
                let email = mssv.includes('@') ? mssv : `${mssv}@due.udn.vn`;
                await auth.signInWithEmailAndPassword(email, pass);
                
                currentUser = { mssv: mssv, ho_ten: "Phạm Nhật Hạ" };
                sessionStorage.setItem('due_student_user', JSON.stringify(currentUser));
                showApp();
            } catch (err) {
                errBox.innerText = "Sai MSSV hoặc mật khẩu đăng nhập!";
                errBox.classList.remove('hidden');
            }
        }

        function handleLogout() {
            auth.signOut();
            sessionStorage.removeItem('due_student_user');
            location.reload();
        }

        function showApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userDisplayName').innerText = currentUser.ho_ten;
            document.getElementById('userDisplayMssv').innerText = `MSSV: ${currentUser.mssv}`;
            loadBooksFromFirestore();
        }

        async function loadBooksFromFirestore() {
            try {
                const snapshot = await db.collection('books').get();
                allBooks = [];
                
                if (snapshot.empty) {
                    const sampleBooks = [
                        { ten_sach: "Phân tích và Thiết kế Hệ thống Thông tin", ma_sach: "MIS101", tac_gia: "PGS.TS Nguyễn Văn A", vi_tri_ke: "Tầng 2 - Kệ A1", so_luong_con: 5 },
                        { ten_sach: "Cơ sở dữ liệu doanh nghiệp với Odoo", ma_sach: "MIS102", tac_gia: "ThS. Trần Thị B", vi_tri_ke: "Tầng 2 - Kệ A2", so_luong_con: 3 },
                        { ten_sach: "Kinh tế vi mô nâng cao", ma_sach: "ECO201", tac_gia: "Dr. John Doe", vi_tri_ke: "Tầng 1 - Kệ B1", so_luong_con: 4 }
                    ];
                    for (let b of sampleBooks) {
                        await db.collection('books').add(b);
                        allBooks.push(b);
                    }
                } else {
                    snapshot.forEach(doc => allBooks.push(doc.data()));
                }
                renderBooks();
            } catch (err) {
                console.error("Lỗi tải sách:", err);
            }
        }

        function renderBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const list = document.getElementById('booksList');
            list.innerHTML = '';

            let filtered = allBooks.filter(b => b.ten_sach.toLowerCase().includes(query) || b.ma_sach.toLowerCase().includes(query));
            document.getElementById('resultsCount').innerText = filtered.length;

            if (filtered.length === 0) {
                list.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-10">Không tìm thấy đầu sách nào.</p>`;
                return;
            }

            filtered.forEach(b => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">${b.ma_sach}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Còn: ${b.so_luong_con || 5} cuốn</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs sm:text-sm">${b.ten_sach}</h4>
                        <p class="text-[11px] text-slate-400">${b.tac_gia} • <span class="text-orange-600 font-semibold">${b.vi_tri_ke || 'Kệ chính'}</span></p>
                    </div>
                `;
            });
        }

        // Tự động khôi phục phiên nếu đã đăng nhập trước đó
        window.onload = () => {
            const saved = sessionStorage.getItem('due_student_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            }
        };
    </script>
</body>
</html>
