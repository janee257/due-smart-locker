<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUE Smart Locker - Quản Trị Thủ Thư</title>
    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-16">

    <!-- MÀN HÌNH ĐĂNG NHẬP THỦ THƯ -->
    <div id="librarianLoginSection" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-200">
            <div class="text-center space-y-1">
                <h2 class="font-bold text-base text-slate-800">Cổng Quản Trị Thủ Thư</h2>
                <p class="text-[11px] text-slate-500">Xác thực tài khoản cán bộ thư viện DUE</p>
            </div>
            <form onsubmit="handleLibrarianLogin(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Email Thủ thư:</label>
                    <input type="email" id="libEmail" value="thuthu@due.udn.vn" required class="w-full p-2.5 bg-slate-50 border rounded-xl">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Mật khẩu:</label>
                    <input type="password" id="libPassword" value="DueLocker#2026" required class="w-full p-2.5 bg-slate-50 border rounded-xl">
                </div>
                <div id="libLoginError" class="hidden p-2.5 rounded-xl bg-rose-50 text-rose-600 font-semibold text-xs"></div>
                <button type="submit" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs shadow-md">Đăng Nhập Cán Bộ</button>
            </form>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH THỦ THƯ -->
    <div id="librarianMainApp" class="hidden">
        <header class="bg-slate-900 text-white p-3.5 shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <h1 class="font-bold text-base">BÀN LÀM VIỆC THỦ THƯ (ADMIN)</h1>
                <button onclick="handleLibrarianLogout()" class="px-3 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-xl">Đăng xuất</button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-6 space-y-6">
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                <h2 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-warehouse text-emerald-600 mr-1"></i> Kho Sách Hệ Thống</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="librarianBooksGrid"></div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1qtSFNNFmVWAo0r0lqIU5cEfCGOKX59M",
            authDomain: "due-smart-locker.firebaseapp.com",
            projectId: "due-smart-locker",
            storageBucket: "due-smart-locker.firebasestorage.app",
            messagingSenderId: "639064006349",
            appId: "1:639064006349:web:ea10677c76872b13989384",
            measurementId: "G-078Z3QDM27"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        async function handleLibrarianLogin(e) {
            e.preventDefault();
            const email = document.getElementById('libEmail').value.trim();
            const pass = document.getElementById('libPassword').value.trim();
            const errBox = document.getElementById('libLoginError');
            errBox.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, pass);
                document.getElementById('librarianLoginSection').classList.add('hidden');
                document.getElementById('librarianMainApp').classList.remove('hidden');
                loadLibBooks();
            } catch (err) {
                errBox.innerText = "Sai tài khoản hoặc mật khẩu thủ thư!";
                errBox.classList.remove('hidden');
            }
        }

        function handleLibrarianLogout() {
            auth.signOut();
            location.reload();
        }

        async function loadLibBooks() {
            try {
                const snapshot = await db.collection('books').get();
                const grid = document.getElementById('librarianBooksGrid');
                grid.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const b = doc.data();
                    grid.innerHTML += `
                        <div class="p-4 border rounded-xl bg-white shadow-sm space-y-1">
                            <span class="text-[10px] font-mono bg-slate-100 px-2 py-0.5 rounded font-bold">${b.ma_sach}</span>
                            <h4 class="font-bold text-slate-800 text-xs">${b.ten_sach}</h4>
                            <p class="text-[11px] text-slate-400">${b.tac_gia}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Lỗi tải kho sách thủ thư:", err);
            }
        }

        window.onload = () => {
            auth.onAuthStateChanged(user => {
                if (user && user.email.includes("thuthu")) {
                    document.getElementById('librarianLoginSection').classList.add('hidden');
                    document.getElementById('librarianMainApp').classList.remove('hidden');
                    loadLibBooks();
                }
            });
        };
    </script>
</body>
</html>
